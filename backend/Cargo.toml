[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
csv = "1.4.0"
dotenvy = "0.15.7"
encoding_rs = "0.8.35"
hex = "0.4.3"
http = "1.5.0"
cross-krb5 = "0.4.2"
krb5-sys = "0.3.0"
ldap3 = { version = "0.12.1", features = ["gssapi"] }
libgssapi = { version = "0.9", default-features = false }
libgssapi-sys = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
translit = "0.8.0"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1.8"
